  <text x="48" y="112" font-size="24" font-weight="700" fill="#17212E">Was die Instruktion mit dem Blick macht</text>
  <text x="48" y="140" font-size="16" fill="#5C6875">Punkte sind Fixationen, ihre Größe steht für die Verweildauer, Linien sind Sprünge zwischen den Fixationen.</text>
