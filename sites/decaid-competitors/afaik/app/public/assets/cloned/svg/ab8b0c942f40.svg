  <text x="48" y="516" font-size="14" font-weight="700" fill="#17212E">Was die Achsen messen</text>
  <rect x="48" y="532" width="12" height="12" rx="3" fill="#C08A2E"></rect>
  <text x="70" y="543" font-size="13" fill="#3E4A58">Selektivität: wie viel Text übersprungen wird</text>
  <rect x="48" y="554" width="12" height="12" rx="3" fill="#2E4372"></rect>
  <text x="70" y="565" font-size="13" fill="#3E4A58">Tiefe: Inferenzen, Kohärenz, Bewertung, Integration</text>
  <rect x="48" y="576" width="12" height="12" rx="3" fill="#1C7A6E"></rect>
  <text x="70" y="587" font-size="13" fill="#3E4A58">Absorption: Aufmerksamkeit, Bildhaftigkeit, Emotion</text>
  <rect x="612" y="492" width="540" height="106" rx="10" fill="#F2F5F8" stroke="#DDE3E9"></rect>
  <text x="636" y="524" font-size="14" font-weight="700" fill="#17212E">Der entscheidende Vergleich</text>
  <text x="636" y="550" font-size="14" fill="#3E4A58">Vertrag und Krimi werden beide langsam und vollständig</text>
  <text x="636" y="570" font-size="14" fill="#3E4A58">gelesen – und laufen auf den beiden anderen Achsen exakt</text>
  <text x="636" y="590" font-size="14" fill="#3E4A58">gegeneinander. Eine gemeinsame Skala kann es nicht geben.</text>
  <line x1="48" y1="634" x2="1152" y2="634" stroke="#DDE3E9" stroke-width="1"></line>
  <text x="48" y="662" font-size="13" fill="#8A93A0">Achsenmodell synthetisiert aus Skimming-, Transportation- und Deep-Comprehension-Forschung. Balkenwerte illustrativ, nicht gemessen.</text>
  <text x="1152" y="662" font-size="13" fill="#C9D1DA" text-anchor="end">Abb. 2</text>
