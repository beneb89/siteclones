    </marker>
  </defs>
  <text x="48" y="52" font-size="15" font-weight="700" fill="#5C6875" letter-spacing="1.6">WAS DEN LESEMODUS BESTIMMT</text>
  <line x1="48" y1="70" x2="1152" y2="70" stroke="#DDE3E9" stroke-width="1"></line>
  <text x="48" y="112" font-size="24" font-weight="700" fill="#17212E">Fünf Faktoren, drei Achsen, eine Rückkopplung</text>
  <text x="48" y="140" font-size="16" fill="#5C6875">Der Modus ist ein Ergebnis, keine Eigenschaft. Er wird bei jeder Leseepisode neu ausgehandelt.</text>
  <rect x="48" y="180" width="204" height="86" rx="9" fill="#FFFFFF" stroke="#DDE3E9"></rect>
  <text x="66" y="208" font-size="15" font-weight="700" fill="#17212E">Leser:in</text>
  <text x="66" y="230" font-size="12.5" fill="#8A93A0">Lesefähigkeit, Arbeitsgedächtnis,</text>
  <text x="66" y="248" font-size="12.5" fill="#8A93A0">Vorwissen, Motivation</text>
  <rect x="276" y="180" width="204" height="86" rx="9" fill="#FFFFFF" stroke="#DDE3E9"></rect>
  <text x="294" y="208" font-size="15" font-weight="700" fill="#17212E">Text</text>
  <text x="294" y="230" font-size="12.5" fill="#8A93A0">Schwierigkeit, Kohärenz,</text>
  <text x="294" y="248" font-size="12.5" fill="#8A93A0">Textsorte, Relevanzsignale</text>
  <rect x="504" y="180" width="204" height="86" rx="9" fill="#FFFFFF" stroke="#17212E" stroke-width="1.8"></rect>
  <text x="522" y="208" font-size="15" font-weight="700" fill="#17212E">Aufgabe</text>
  <text x="522" y="230" font-size="12.5" fill="#8A93A0">Überblick, Suche, Lernen,</text>
  <text x="522" y="248" font-size="12.5" fill="#8A93A0">Prüfen, Genuss</text>
  <text x="522" y="290" font-size="12" font-weight="700" fill="#17212E" letter-spacing="0.5">STÄRKSTER EINZELFAKTOR</text>
  <rect x="732" y="180" width="204" height="86" rx="9" fill="#FFFFFF" stroke="#DDE3E9"></rect>
  <text x="750" y="208" font-size="15" font-weight="700" fill="#17212E">Kontext</text>
  <text x="750" y="230" font-size="12.5" fill="#8A93A0">Zeitdruck, Ablenkung,</text>
  <text x="750" y="248" font-size="12.5" fill="#8A93A0">Prüfungssituation</text>
  <rect x="960" y="180" width="192" height="86" rx="9" fill="#FFFFFF" stroke="#DDE3E9"></rect>
  <text x="978" y="208" font-size="15" font-weight="700" fill="#17212E">Medium</text>
  <text x="978" y="230" font-size="12.5" fill="#8A93A0">Papier, E-Reader, Web,</text>
  <text x="978" y="248" font-size="12.5" fill="#8A93A0">Links, Scrollen</text>
  <path d="M150 266 L 150 312" fill="none" stroke="#C9D1DA" stroke-width="1.6"></path>
