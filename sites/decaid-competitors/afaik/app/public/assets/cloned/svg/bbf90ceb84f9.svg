  <rect x="396" y="348" width="408" height="60" rx="9" fill="#17212E"></rect>
  <text x="600" y="376" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ressourcen- und Zielallokation</text>
  <text x="600" y="396" font-size="12.5" fill="#A9B4C0" text-anchor="middle">Wie viel Aufmerksamkeit bekommt welche Textstelle?</text>
  <path d="M480 408 L 480 440 L 208 440 L 208 466" fill="none" stroke="#8A93A0" stroke-width="1.6" marker-end="url(#pfeil)"></path>
