  <path d="M720 408 L 720 440 L 992 440 L 992 466" fill="none" stroke="#8A93A0" stroke-width="1.6" marker-end="url(#pfeil)"></path>
  <rect x="88" y="474" width="240" height="72" rx="9" fill="#FFFFFF" stroke="#C08A2E" stroke-width="1.8"></rect>
  <text x="208" y="504" font-size="15" font-weight="700" fill="#C08A2E" text-anchor="middle">Selektivität / Tempo</text>
  <text x="208" y="526" font-size="12.5" fill="#8A93A0" text-anchor="middle">wie viel wird übersprungen</text>
  <rect x="480" y="474" width="240" height="72" rx="9" fill="#FFFFFF" stroke="#2E4372" stroke-width="1.8"></rect>
  <text x="600" y="504" font-size="15" font-weight="700" fill="#2E4372" text-anchor="middle">Verarbeitungstiefe</text>
  <text x="600" y="526" font-size="12.5" fill="#8A93A0" text-anchor="middle">Inferenzen und Integration</text>
  <rect x="872" y="474" width="240" height="72" rx="9" fill="#FFFFFF" stroke="#1C7A6E" stroke-width="1.8"></rect>
  <text x="992" y="504" font-size="15" font-weight="700" fill="#1C7A6E" text-anchor="middle">Absorption</text>
  <text x="992" y="526" font-size="12.5" fill="#8A93A0" text-anchor="middle">Aufmerksamkeit und Erleben</text>
  <path d="M208 546 L 208 578 L 580 578 L 580 604" fill="none" stroke="#8A93A0" stroke-width="1.6"></path>
  <path d="M600 546 L 600 604" fill="none" stroke="#8A93A0" stroke-width="1.6"></path>
  <path d="M992 546 L 992 578 L 620 578 L 620 604" fill="none" stroke="#8A93A0" stroke-width="1.6"></path>
  <path d="M600 596 L 600 616" fill="none" stroke="#8A93A0" stroke-width="1.8" marker-end="url(#pfeil)"></path>
  <rect x="432" y="620" width="336" height="58" rx="9" fill="#F2F5F8" stroke="#DDE3E9"></rect>
  <text x="600" y="646" font-size="15" font-weight="700" fill="#17212E" text-anchor="middle">Verständnis · Gedächtnis · Erlebnis</text>
  <text x="600" y="666" font-size="12.5" fill="#8A93A0" text-anchor="middle">was am Ende hängen bleibt</text>
  <path d="M768 650 C 900 650 940 620 940 560 C 940 430 880 388 812 380" fill="none" stroke="#A8322A" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#pfeilRot)"></path>
  <text x="962" y="536" font-size="13" font-weight="700" fill="#A8322A">Metakognitive</text>
  <text x="962" y="554" font-size="13" font-weight="700" fill="#A8322A">Rückkopplung</text>
  <text x="962" y="576" font-size="12.5" fill="#8A93A0">langsamer werden,</text>
  <text x="962" y="594" font-size="12.5" fill="#8A93A0">zurückspringen,</text>
  <text x="962" y="612" font-size="12.5" fill="#8A93A0">Strategie wechseln</text>
  <line x1="48" y1="706" x2="1152" y2="706" stroke="#DDE3E9" stroke-width="1"></line>
  <text x="48" y="734" font-size="13" fill="#8A93A0">Synthese aus Skimming-, Working-Memory-, Mind-Wandering- und Medienforschung. Kein validiertes Strukturmodell.</text>
  <text x="1152" y="734" font-size="13" fill="#C9D1DA" text-anchor="end">Abb. 4</text>
