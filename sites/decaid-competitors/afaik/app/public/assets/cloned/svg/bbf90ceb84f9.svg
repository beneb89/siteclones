<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="760" fill="#FBFCFD"></rect>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
