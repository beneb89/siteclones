<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 525" width="100%" role="img" aria-labelledby="t4 d4" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t4">Anthropic Usage Index ausgewählter Länder</title>
  <desc id="d4">Australien führt mit einem Index von 6,4, Deutschland liegt bei 2,4 auf Rang 26 von 121 Ländern, Tansania bildet mit 0,07 das Schlusslicht.</desc>
  <style>
.ink{fill:#1a1a1a}.mut{fill:#6b6b6b}.rule{stroke:#e2e0da}
@media (prefers-color-scheme:dark){.ink{fill:#ededed}.mut{fill:#9a9a9a}.rule{stroke:#343431}}
</style>
  <text x="24" y="30" class="ink" font-size="17" font-weight="500">Der digitale Graben, sauber normiert</text>
  <text x="24" y="52" class="mut" font-size="12.5">Anthropic Usage Index: Anteil an der Nutzung geteilt durch Anteil an der Bevölkerung im Erwerbsalter</text>
  <text x="24" y="70" class="mut" font-size="12.5">1,0 bedeutet Nutzung exakt proportional zur Bevölkerung. Rang von 121 erfassten Ländern.</text>
  <line x1="306" y1="92" x2="306" y2="445" class="rule" stroke-width="1" stroke-dasharray="3 3"></line>
  <text x="311" y="102" class="mut" font-size="11">1,0</text>
  <g font-size="13">
    <text x="24" y="120" class="ink">Australien</text>
    <rect x="250" y="108" width="360" height="15" fill="#b8b6ae"></rect>
    <text x="696" y="120" class="mut" text-anchor="end">6,40 · Rang 1</text>
    <text x="24" y="150" class="ink">Schweiz</text>
    <rect x="250" y="138" width="282" height="15" fill="#b8b6ae"></rect>
    <text x="696" y="150" class="mut" text-anchor="end">5,02 · Rang 3</text>
    <text x="24" y="180" class="ink">Frankreich</text>
    <rect x="250" y="168" width="223" height="15" fill="#b8b6ae"></rect>
    <text x="696" y="180" class="mut" text-anchor="end">3,97 · Rang 10</text>
    <text x="24" y="210" class="ink">Niederlande</text>
    <rect x="250" y="198" width="219" height="15" fill="#b8b6ae"></rect>
    <text x="696" y="210" class="mut" text-anchor="end">3,90 · Rang 11</text>
    <text x="24" y="240" class="ink">USA</text>
    <rect x="250" y="228" width="218" height="15" fill="#b8b6ae"></rect>
    <text x="696" y="240" class="mut" text-anchor="end">3,87 · Rang 12</text>
    <text x="24" y="270" class="ink">Österreich</text>
    <rect x="250" y="258" width="147" height="15" fill="#b8b6ae"></rect>
    <text x="696" y="270" class="mut" text-anchor="end">2,61 · Rang 25</text>
    <text x="24" y="300" class="ink" font-weight="500">Deutschland</text>
    <rect x="250" y="288" width="135" height="15" fill="#2a78d6"></rect>
    <text x="696" y="300" class="ink" text-anchor="end" font-weight="500">2,40 · Rang 26</text>
    <text x="24" y="330" class="ink">Japan</text>
    <rect x="250" y="318" width="107" height="15" fill="#b8b6ae"></rect>
    <text x="696" y="330" class="mut" text-anchor="end">1,91 · Rang 32</text>
    <text x="24" y="360" class="ink">Brasilien</text>
    <rect x="250" y="348" width="54" height="15" fill="#b8b6ae"></rect>
    <text x="696" y="360" class="mut" text-anchor="end">0,96 · Rang 61</text>
    <text x="24" y="390" class="ink">Indien</text>
    <rect x="250" y="378" width="17" height="15" fill="#b8b6ae"></rect>
    <text x="696" y="390" class="mut" text-anchor="end">0,30 · Rang 102</text>
    <text x="24" y="420" class="ink">Nigeria</text>
    <rect x="250" y="408" width="14" height="15" fill="#b8b6ae"></rect>
    <text x="696" y="420" class="mut" text-anchor="end">0,24 · Rang 106</text>
    <text x="24" y="450" class="ink">Tansania</text>
    <rect x="250" y="438" width="4" height="15" fill="#b8b6ae"></rect>
    <text x="696" y="450" class="mut" text-anchor="end">0,07 · Rang 121</text>
  </g>
  <line x1="24" y1="474" x2="696" y2="474" class="rule" stroke-width="1"></line>
  <text x="24" y="494" class="mut" font-size="11.5">Der Index bevorzugt bevölkerungsarme Länder — Australien und Singapur an der Spitze sind teilweise ein Größeneffekt.</text>
  <text x="24" y="510" class="mut" font-size="11.5">Momentaufnahme Mai 2026, keine Zeitreihe. Quelle: Anthropic Economic Index, CC BY 4.0.</text>
</svg>
