<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="880" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1e1b4b">Two ad platforms, two MCP operating models</text>
  <text x="40" y="76" font-size="14" fill="#6b7280">Google ships read-only; Meta ships read-and-write. That one design choice changes everything downstream.</text>

  <!-- Column headers -->
  <rect x="300" y="100" width="270" height="40" rx="8" fill="#eef2ff"/>
  <text x="435" y="126" font-size="16" font-weight="700" fill="#4f46e5" text-anchor="middle">Google Ads MCP</text>
  <rect x="590" y="100" width="250" height="40" rx="8" fill="#f5f3ff"/>
  <text x="715" y="126" font-size="16" font-weight="700" fill="#6366f1" text-anchor="middle">Meta Ads MCP</text>

  <!-- Rows -->
  <!-- Row 1 -->
  <text x="40" y="172" font-size="14" font-weight="600" fill="#374151">Access model</text>
  <rect x="300" y="152" width="270" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="435" y="174" font-size="13" fill="#1e1b4b" text-anchor="middle">Read-only (GAQL)</text>
  <rect x="590" y="152" width="250" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="715" y="174" font-size="13" fill="#1e1b4b" text-anchor="middle">Read + write</text>

  <!-- Row 2 -->
  <text x="40" y="216" font-size="14" font-weight="600" fill="#374151">Tools exposed</text>
  <rect x="300" y="196" width="270" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="435" y="218" font-size="13" fill="#1e1b4b" text-anchor="middle">2 core (search + list)</text>
  <rect x="590" y="196" width="250" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="715" y="218" font-size="13" fill="#1e1b4b" text-anchor="middle">29 natural-language</text>

  <!-- Row 3 -->
  <text x="40" y="260" font-size="14" font-weight="600" fill="#374151">Auth path</text>
  <rect x="300" y="240" width="270" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="435" y="262" font-size="13" fill="#1e1b4b" text-anchor="middle">Dev token + GCP + OAuth</text>
  <rect x="590" y="240" width="250" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="715" y="262" font-size="13" fill="#1e1b4b" text-anchor="middle">Business OAuth click</text>

  <!-- Row 4 -->
  <text x="40" y="304" font-size="14" font-weight="600" fill="#374151">Setup friction</text>
  <rect x="300" y="284" width="270" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="435" y="306" font-size="13" fill="#1e1b4b" text-anchor="middle">1-2 days (Standard token)</text>
  <rect x="590" y="284" width="250" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="715" y="306" font-size="13" fill="#1e1b4b" text-anchor="middle">~5-7 min (OAuth)</text>

  <!-- Row 5 -->
  <text x="40" y="348" font-size="14" font-weight="600" fill="#374151">Can the agent spend?</text>
  <rect x="300" y="328" width="270" height="34" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="435" y="350" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle">No &#8212; structurally blocked</text>
  <rect x="590" y="328" width="250" height="34" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="715" y="350" font-size="13" fill="#1e1b4b" text-anchor="middle">Yes &#8212; creates paused</text>

  <!-- Bottom thesis bars: where the safety gate lives -->
  <text x="40" y="412" font-size="15" font-weight="700" fill="#1e1b4b">Where the safety gate lives</text>

  <rect x="40" y="428" width="800" height="32" rx="6" fill="#eef2ff"/>
  <rect x="40" y="428" width="800" height="32" rx="6" fill="none" stroke="#c7d2fe"/>
  <rect x="40" y="428" width="800" height="32" rx="6" fill="#4f46e5"/>
  <text x="56" y="449" font-size="13" font-weight="600" fill="#ffffff">Google: the API enforces it &#8212; the agent literally cannot write</text>

  <rect x="40" y="468" width="800" height="32" rx="6" fill="#f5f3ff"/>
  <rect x="40" y="468" width="640" height="32" rx="6" fill="#c7d2fe"/>
  <text x="56" y="489" font-size="13" font-weight="600" fill="#312e81">Meta: you enforce it &#8212; created-paused + a human approval gate</text>

  <text x="40" y="538" font-size="11" fill="#9ca3af">Source: Google Ads API MCP docs (read-only, 2 tools); Meta Ads MCP (29 tools, read+write, created-paused), 2026.</text>
</svg>
